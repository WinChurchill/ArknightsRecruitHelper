name: Build & release exe

on:
  push:
    tags: ["v*"]          # 推送 v1.0.0 这样的标签 → 自动打包并发布
  workflow_dispatch:      # 也可以在 Actions 页面手动运行（只打包，不发布）

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh operator data (best effort)
        continue-on-error: true
        run: python -c "import recruit_core as rc; print(rc.update_data(force=False))"

      - name: Build exe
        shell: cmd
        run: build.bat

      - name: Self-test packaged exe (non-admin build)
        shell: pwsh
        run: |
          .venv-build\Scripts\python.exe -m PyInstaller --noconfirm --onefile --windowed --name ArkSelftest `
            --distpath build\st --workpath build\stw --specpath build `
            --add-data "$PWD\data\pool_cn.json;data" --add-data "$PWD\data\pool_en.json;data" `
            --add-data "$PWD\data\pool_jp.json;data" --add-data "$PWD\data\pool_kr.json;data" `
            --add-data "$PWD\build\THIRD_PARTY_LICENSES.txt;." `
            --collect-all rapidocr_onnxruntime --hidden-import pystray._win32 app.py
          $p = Start-Process build\st\ArkSelftest.exe -ArgumentList "--selftest","$PWD\selftest.txt" -PassThru -Wait
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: ArknightsRecruitHelper
          path: |
            dist/ArknightsRecruitHelper.exe
            build/THIRD_PARTY_LICENSES.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ArknightsRecruitHelper.exe
            build/THIRD_PARTY_LICENSES.txt
          body: |
            **下载 `ArknightsRecruitHelper.exe`，双击，点「安装并开始使用」。**
            Download `ArknightsRecruitHelper.exe`, double-click it, press **Install & start**.

            第一次运行如果出现「Windows 已保护你的电脑」：点「更多信息」→「仍要运行」。
            If Windows shows "Windows protected your PC": click "More info" → "Run anyway".
